name: Gerar currículo PDF
on:
  push:
    branches: [main]
    paths:
      - 'curriculo.html'
      - '.github/workflows/gerar-curriculo.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  gerar-pdf:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar Playwright e Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Gerar PDF
        run: |
          cat > pdf.mjs <<'EOF'
          import { chromium } from 'playwright';
          import path from 'path';
          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage();
          await page.goto('file://' + path.resolve('curriculo.html'), {waitUntil:'networkidle'});
          await page.pdf({path:'Curriculo_Remualdo_Maciel.pdf',format:'A4',printBackground:true,margin:{top:'0mm',right:'0mm',bottom:'0mm',left:'0mm'}});
          await browser.close();
          EOF
          node pdf.mjs
      - name: Garantir botão de currículo no portfólio
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          if 'Curriculo_Remualdo_Maciel.pdf' not in s:
              alvo='<a class="btn primary" href="#cases">Ver projetos e resultados</a>'
              novo=alvo+'<a class="btn" href="Curriculo_Remualdo_Maciel.pdf" download>Baixar currículo (PDF)</a>'
              s=s.replace(alvo,novo,1)
              p.write_text(s)
          PY
      - name: Publicar currículo atualizado
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Curriculo_Remualdo_Maciel.pdf index.html
          git diff --cached --quiet && exit 0
          git commit -m 'chore: atualizar currículo PDF e link [skip ci]'
          git push
